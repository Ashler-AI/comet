<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#060606">
  <title>Crew</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#message">Skip to composer</a>
  <header class="topbar">
    <span class="wordmark">Crew</span>
    <span id="session-title" class="session-title"></span>
    <span id="connection" class="connection" role="status">Connecting…</span>
  </header>
  <main id="main" class="content">
    <div id="empty" class="empty" hidden>
      <svg class="crew-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M0 0h35v10H0zM38 0h10v35H38zM13 38h35v10H13zM0 13h10v35H0zM19 19h10v10H19z" fill="currentColor"/></svg>
      <p id="empty-prompt">Loading your session…</p>
    </div>
    <button id="older" class="text-button older" type="button" hidden>Load earlier messages</button>
    <section id="transcript" aria-label="Conversation" aria-busy="true"></section>
  </main>
  <div class="composer-dock">
    <div id="error" class="error-banner" role="alert" hidden><span id="error-text"></span><button id="dismiss-error" type="button" aria-label="Dismiss error">×</button></div>
    <section id="pending-input" aria-label="Agent questions" hidden></section>
    <div class="activity-line"><span id="activity" role="status"></span><button id="latest" class="text-button" type="button" hidden>Jump to latest ↓</button></div>
    <form id="composer" class="composer">
      <label class="sr-only" for="message">Message Crew</label>
      <textarea id="message" name="message" rows="2" placeholder="Message Crew…" autocomplete="off" spellcheck="true" aria-describedby="compose-help" disabled></textarea>
      <div id="attachments" class="attachments" aria-label="Attached files" hidden></div>
      <div class="composer-toolbar">
        <span id="compose-help" class="compose-help">Enter to send · Shift Enter for a new line</span>
        <div class="composer-controls">
          <label class="sr-only" for="model">Model</label>
          <select id="model" title="Model" disabled><option value="">Session model</option></select>
          <label class="sr-only" for="reasoning">Reasoning effort</label>
          <select id="reasoning" title="Reasoning effort" disabled><option value="">Default</option></select>
          <input id="file-input" type="file" multiple hidden>
          <button id="attach" class="icon-button" type="button" title="Attach files" aria-label="Attach files" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 13 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9a3 3 0 0 1 4 4l-9 9a1 1 0 0 1-2-2l8-8"/></svg></button>
          <button id="stop" class="round-button stop" type="button" title="Stop agent" aria-label="Stop agent" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
          <button id="send" class="round-button" type="submit" title="Send message" aria-label="Send message" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18V6m-5 5 5-5 5 5"/></svg></button>
        </div>
      </div>
    </form>
    <footer class="session-footer"><span id="cwd" title="Assigned working directory"></span><span id="branch" title="Current branch"></span></footer>
  </div>
</body>
</html>
