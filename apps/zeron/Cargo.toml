[package]
name = "zeron"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Shared Crew runtime/profile resolution for both the headed app and the
# background engine binary. The UI remains linked only by `comet`.
[lib]
name = "zeron_app"
path = "src/lib.rs"

[[bin]]
name = "zeron"
path = "src/main.rs"

[[bin]]
name = "zeron-engine"
path = "src/bin/zeron-engine.rs"

[dependencies]
zeron-engine.workspace = true
zeron-rpc.workspace = true
zeron-ui.workspace = true
zeron-update.workspace = true
zeron-mcp.workspace = true
zeron-notify.workspace = true
zeron-harness.workspace = true
zeron-sync.workspace = true
zeron-proto.workspace = true
serde.workspace = true
tempfile.workspace = true
sha2.workspace = true
uuid.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
embed-resource = "3.0.11"
