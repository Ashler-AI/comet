name: deploy

# Canonical staging candidates only. Required reviewers protect Worker deployment
# and release-reader synchronization. Retained legacy state and rollback are sealed
# with the native candidate; production has no deployment path here.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Reviewed full 40-character commit SHA; must match the dispatched ref"
        required: true
        type: string
      target:
        description: "Build a candidate only, or deploy that exact candidate to native staging"
        required: true
        default: candidate
        type: choice
        options: [candidate, staging]

permissions:
  contents: read

concurrency:
  group: comet-edge-native-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Refuse unauthorized targets before checkout, tooling or protected secrets.
  staging-scope:
    if: github.repository_owner == 'Ashler-AI'
    runs-on: ubuntu-24.04
    steps:
      - id: target
        name: Reject targets outside this staging-only authorization
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          case "$REQUESTED_TARGET" in
            candidate|staging) ;;
            *) echo "::error::This native/retained-rollback candidate is staging-only. Production requires independent qualification and authorization."; exit 1 ;;
          esac

  candidate:
    if: github.repository_owner == 'Ashler-AI'
    needs: staging-scope
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      digest: ${{ steps.candidate.outputs.digest }}
      rollback_digest: ${{ steps.candidate.outputs.rollback_digest }}
    steps:
      - id: source_request
        name: Require reviewed immutable source and staging-only target
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::source_sha must be a full lowercase 40-character commit SHA'; exit 1; }
          [[ "$SOURCE_SHA" = "$GITHUB_SHA" ]] || { echo '::error::source_sha must match the dispatched ref; select that reviewed source with --ref'; exit 1; }
          case "$TARGET" in candidate|staging) ;; *) echo '::error::unsupported deployment target'; exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        name: Verify reviewed checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked edge dependencies
        working-directory: edge
        run: npm ci
      - name: Verify native browser contracts
        run: node --test apps/web/server.test.mjs
      - name: Test staging artifact sealing
        run: node --test edge/scripts/staging-artifacts.test.mjs
      - name: Generate Worker binding types
        working-directory: edge
        run: npm run types
      - name: Require current Worker binding declarations
        run: |
          git ls-files --error-unmatch -- edge/worker-configuration.d.ts
          git diff --exit-code -- edge/worker-configuration.d.ts
      - name: Typecheck
        working-directory: edge
        run: npm run typecheck
      - name: Test edge units and native workerd behavior
        working-directory: edge
        run: npm test
      - name: Test release contracts and secret synchronization behavior
        run: node --test scripts/release-workflow.test.mjs
      - name: Test retained canonical staging boundaries
        working-directory: edge
        run: npx vitest run -c vitest.staging.config.ts
      - name: Build canonical candidate and forward-retained rollback once
        run: node edge/scripts/staging-artifacts.mjs build "$RUNNER_TEMP/comet-edge-pair"
      - id: candidate
        name: Seal candidate and forward-retained rollback digests
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          for kind in candidate rollback; do
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -czf "comet-edge-$kind.tar.gz" -C "$RUNNER_TEMP/comet-edge-pair/$kind" .
            sha256sum "comet-edge-$kind.tar.gz" > "comet-edge-$kind.tar.gz.sha256"
          done
          digest="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          rollback_digest="$(sha256sum comet-edge-rollback.tar.gz | cut -d' ' -f1)"
          jq -n --arg digest "$digest" --arg rollbackDigest "$rollback_digest" --arg commit "$SOURCE_SHA" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schemaVersion:2,sha256:$digest,rollbackSha256:$rollbackDigest,sourceCommit:$commit,workflowRun:$workflowRun,proof:"staging-proof.json"}' \
            > comet-edge-candidate.provenance.json
          echo "rollback_digest=$rollback_digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comet-edge-candidate-${{ steps.source.outputs.sha }}
          path: |
            comet-edge-candidate.tar.gz
            comet-edge-candidate.tar.gz.sha256
            comet-edge-candidate.provenance.json
            comet-edge-rollback.tar.gz
            comet-edge-rollback.tar.gz.sha256
          if-no-files-found: error

  sync-staging-release-feed-secrets:
    if: inputs.target == 'staging'
    needs: candidate
    runs-on: ubuntu-24.04
    environment: comet-release-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked secret synchronization tooling
        working-directory: edge
        run: npm ci
      - name: Synchronize required staging release-reader secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMET_RELEASES_GCS_BUCKET: ${{ secrets.COMET_RELEASES_GCS_BUCKET }}
          GCP_RELEASE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_EMAIL }}
          GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: node scripts/sync-edge-release-feed-secrets.mjs staging

  staging:
    if: inputs.target == 'staging'
    needs: [candidate, sync-staging-release-feed-secrets]
    runs-on: ubuntu-24.04
    environment: comet-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: comet-edge-candidate-${{ needs.candidate.outputs.sha }}
      - id: verify
        name: Verify both candidate bytes and retained rollback against reviewed source
        env:
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
          EXPECTED_DIGEST: ${{ needs.candidate.outputs.digest }}
          EXPECTED_ROLLBACK_DIGEST: ${{ needs.candidate.outputs.rollback_digest }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sha256sum --check comet-edge-candidate.tar.gz.sha256 comet-edge-rollback.tar.gz.sha256
          actual="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          rollback_actual="$(sha256sum comet-edge-rollback.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_DIGEST"
          test "$rollback_actual" = "$EXPECTED_ROLLBACK_DIGEST"
          jq -e --arg digest "$actual" --arg rollbackDigest "$rollback_actual" --arg commit "$SOURCE_SHA" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '.schemaVersion == 2 and .sha256 == $digest and .rollbackSha256 == $rollbackDigest and .sourceCommit == $commit and .workflowRun == $workflowRun and .proof == "staging-proof.json"' \
            comet-edge-candidate.provenance.json > /dev/null
          mkdir -p "$RUNNER_TEMP/verified-edge/candidate" "$RUNNER_TEMP/verified-edge/rollback"
          tar -xzf comet-edge-candidate.tar.gz -C "$RUNNER_TEMP/verified-edge/candidate"
          tar -xzf comet-edge-rollback.tar.gz -C "$RUNNER_TEMP/verified-edge/rollback"
          node edge/scripts/staging-artifacts.mjs verify "$RUNNER_TEMP/verified-edge"
          echo "entry=$RUNNER_TEMP/verified-edge/candidate/staging.js" >> "$GITHUB_OUTPUT"
      - name: Deploy exact candidate to native staging only
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CANDIDATE_ENTRY: ${{ steps.verify.outputs.entry }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy "$CANDIDATE_ENTRY" --no-bundle --config wrangler.jsonc --env staging
