name: deploy

# Activation hold: merges, pushes and tags never deploy Edge or synchronize
# release-feed secrets. An operator must separately authorize a manual run.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Highest environment to deploy"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: comet-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # This candidate is qualified only for canonical staging. Keep the existing
  # production definitions dormant; never send staging entries/proofs to them.
  staging-scope:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject targets outside this staging-only authorization
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          if [ "$REQUESTED_TARGET" != "staging" ]; then
            echo "::error::This native/retained-rollback candidate is staging-only. Production requires an independently qualified path and authorization."
            exit 1
          fi

  candidate:
    needs: staging-scope
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
      rollback_digest: ${{ steps.candidate.outputs.rollback_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked edge dependencies
        working-directory: edge
        run: npm ci
      - name: Verify native browser contracts
        run: node --test apps/web/server.test.mjs
      - name: Test staging artifact sealing
        run: node --test edge/scripts/staging-artifacts.test.mjs
      - name: Generate Worker binding types
        working-directory: edge
        run: npm run types
      - name: Require current Worker binding declarations
        run: |
          git ls-files --error-unmatch -- edge/worker-configuration.d.ts
          git diff --exit-code -- edge/worker-configuration.d.ts
      - name: Typecheck
        working-directory: edge
        run: npm run typecheck
      - name: Test
        working-directory: edge
        run: npm test
      - name: Test retained canonical staging boundaries
        working-directory: edge
        run: npx vitest run -c vitest.staging.config.ts
      - name: Build canonical candidate and forward-retained rollback once
        run: node edge/scripts/staging-artifacts.mjs build "$RUNNER_TEMP/comet-edge-pair"
      - id: candidate
        name: Seal candidate and forward-retained rollback digests
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          for kind in candidate rollback; do
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
              -czf "comet-edge-$kind.tar.gz" -C "$RUNNER_TEMP/comet-edge-pair/$kind" .
            sha256sum "comet-edge-$kind.tar.gz" > "comet-edge-$kind.tar.gz.sha256"
          done
          digest="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          rollback_digest="$(sha256sum comet-edge-rollback.tar.gz | cut -d' ' -f1)"
          jq -n --arg digest "$digest" --arg rollbackDigest "$rollback_digest" --arg commit "$GITHUB_SHA" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schemaVersion:2,sha256:$digest,rollbackSha256:$rollbackDigest,sourceCommit:$commit,workflowRun:$workflowRun,proof:"staging-proof.json"}' \
            > comet-edge-candidate.provenance.json
          echo "rollback_digest=$rollback_digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: comet-edge-candidate-${{ github.sha }}
          path: |
            comet-edge-candidate.tar.gz
            comet-edge-candidate.tar.gz.sha256
            comet-edge-candidate.provenance.json
            comet-edge-rollback.tar.gz
            comet-edge-rollback.tar.gz.sha256
          if-no-files-found: error

  staging:
    if: github.repository_owner == 'Ashler-AI' && github.event_name == 'workflow_dispatch'
    # Existing staging Worker secrets are retained; this job never synchronizes them.
    needs: [candidate]
    runs-on: ubuntu-24.04
    environment: comet-staging
    outputs:
      deployed_digest: ${{ steps.verify.outputs.digest }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: comet-edge-candidate-${{ github.sha }}
      - id: verify
        name: Verify both sealed artifacts and full staging preservation proof
        env:
          EXPECTED_DIGEST: ${{ needs.candidate.outputs.digest }}
          EXPECTED_ROLLBACK_DIGEST: ${{ needs.candidate.outputs.rollback_digest }}
        run: |
          set -euo pipefail
          sha256sum --check comet-edge-candidate.tar.gz.sha256 comet-edge-rollback.tar.gz.sha256
          actual="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          rollback_actual="$(sha256sum comet-edge-rollback.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_DIGEST"
          test "$rollback_actual" = "$EXPECTED_ROLLBACK_DIGEST"
          mkdir -p "$RUNNER_TEMP/verified-edge/candidate" "$RUNNER_TEMP/verified-edge/rollback"
          tar -xzf comet-edge-candidate.tar.gz -C "$RUNNER_TEMP/verified-edge/candidate"
          tar -xzf comet-edge-rollback.tar.gz -C "$RUNNER_TEMP/verified-edge/rollback"
          node edge/scripts/staging-artifacts.mjs verify "$RUNNER_TEMP/verified-edge"
          echo "entry=$RUNNER_TEMP/verified-edge/candidate/staging.js" >> "$GITHUB_OUTPUT"
          echo "digest=$actual" >> "$GITHUB_OUTPUT"
      - id: gcp_iap
        name: Mint staging GCP IAP identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_IAP_AUDIENCE }}
          create_credentials_file: false
      - name: Require staging IAP credential
        env:
          IAP_ID_TOKEN: ${{ steps.gcp_iap.outputs.id_token }}
        run: test -n "$IAP_ID_TOKEN"
      - name: Deploy exact candidate with checked-in staging resources
        working-directory: edge
        run: npx wrangler deploy "${{ steps.verify.outputs.entry }}" --no-bundle --config wrangler.jsonc --env staging

  production:
    if: github.repository_owner == 'Ashler-AI' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: [candidate, staging, sync-production-release-feed-secrets]
    runs-on: ubuntu-24.04
    # Release-feed synchronization must succeed before reusing staging credentials.
    # Reviewer approval exists only if configured on comet-release-production.
    environment: comet-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: comet-edge-candidate-${{ github.sha }}
      - id: verify
        name: Require byte-identical staged candidate
        env:
          BUILD_DIGEST: ${{ needs.candidate.outputs.digest }}
          STAGING_DIGEST: ${{ needs.staging.outputs.deployed_digest }}
        run: |
          sha256sum --check comet-edge-candidate.tar.gz.sha256
          actual="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$BUILD_DIGEST"
          test "$actual" = "$STAGING_DIGEST"
          mkdir "$RUNNER_TEMP/candidate"
          tar -xzf comet-edge-candidate.tar.gz -C "$RUNNER_TEMP/candidate"
          entry="$RUNNER_TEMP/candidate/staging.js"
          test -f "$entry"
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
      - name: Require Ashler platform-scoped GCP credentials
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_IAP_AUDIENCE: ${{ vars.GCP_IAP_AUDIENCE }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          test "$GCP_PROJECT_ID" = "ashler-platform"
          test "$GCP_IAP_AUDIENCE" = "54440053364-sdi2vlnsaavl9qne53p98lah23g8vei7.apps.googleusercontent.com"
          case "$GCP_SERVICE_ACCOUNT" in
            *@"$GCP_PROJECT_ID".iam.gserviceaccount.com) ;;
            *) echo "::error::GCP service account is outside $GCP_PROJECT_ID"; exit 1 ;;
          esac
          case "$GCP_WORKLOAD_IDENTITY_PROVIDER" in
            projects/54440053364/locations/global/workloadIdentityPools/*/providers/*) ;;
            *) echo "::error::Workload identity provider is outside GCP project 54440053364"; exit 1 ;;
          esac
      - id: gcp_iap
        name: Mint production GCP IAP identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_IAP_AUDIENCE }}
          create_credentials_file: false
      - name: Require production IAP credential
        env:
          IAP_ID_TOKEN: ${{ steps.gcp_iap.outputs.id_token }}
        run: test -n "$IAP_ID_TOKEN"
      - name: Deploy exact staged candidate with checked-in production resources
        working-directory: edge
        run: npx wrangler deploy "${{ steps.verify.outputs.entry }}" --no-bundle --config wrangler.jsonc --env production

  sync-production-release-feed-secrets:
    name: Synchronize production release-feed secrets
    if: github.repository_owner == 'Ashler-AI' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: [candidate, staging]
    runs-on: ubuntu-24.04
    environment: comet-release-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COMET_RELEASES_GCS_BUCKET: ${{ secrets.COMET_RELEASES_GCS_BUCKET }}
      GCP_RELEASE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_EMAIL }}
      GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - name: Synchronize production release-feed secrets
        run: node scripts/sync-edge-release-feed-secrets.mjs production
