name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Existing staging Worker retirement deployment"
        required: true
        default: staging
        type: choice
        options: [staging]
      reviewed_sha:
        description: "Reviewed full lowercase commit SHA (must equal the dispatched ref)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: comet-staging-migration-retirement
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require reviewed staging source
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$TARGET" = staging
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked edge dependencies
        working-directory: edge
        run: npm ci
      - name: Local migration retirement workerd smoke
        working-directory: edge
        timeout-minutes: 10
        run: |
          set -euo pipefail
          state="$(mktemp -d "$RUNNER_TEMP/comet-retirement-smoke.XXXXXX")"
          pid=""
          cleanup() {
            if [ -n "$pid" ]; then
              kill -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$state"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          setsid ./node_modules/.bin/wrangler dev --local --config wrangler.migration-smoke.jsonc \
            --ip 127.0.0.1 --port 28765 --persist-to "$state/persistence" >"$state/workerd.log" 2>&1 &
          pid=$!
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            if curl --silent --output /dev/null --max-time 1 http://127.0.0.1:28765; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$state/workerd.log"; exit 1; fi
          timeout 300s node scripts/migration-retirement-smoke.mjs http://127.0.0.1:28765
      - name: Typecheck
        working-directory: edge
        run: npm run typecheck
      - name: Test migration retirement behavior
        working-directory: edge
        run: npm test -- src/migration-retirement.test.ts
      - name: Test staging release-reader synchronization
        run: node --test scripts/sync-edge-release-feed-secrets.test.mjs
      - name: Build deployment candidate once
        working-directory: edge
        run: npx wrangler deploy --dry-run --config wrangler.migration-staging.jsonc --outdir "$RUNNER_TEMP/comet-edge-candidate"
      - id: candidate
        name: Seal candidate digest
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf comet-edge-candidate.tar.gz -C "$RUNNER_TEMP/comet-edge-candidate" .
          digest="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          printf '%s  %s\n' "$digest" comet-edge-candidate.tar.gz > comet-edge-candidate.tar.gz.sha256
          jq -n --arg digest "$digest" --arg commit "$GITHUB_SHA" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schemaVersion:1,sha256:$digest,sourceCommit:$commit,workflowRun:$workflowRun}' \
            > comet-edge-candidate.provenance.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: comet-edge-candidate-${{ github.sha }}
          path: |
            comet-edge-candidate.tar.gz
            comet-edge-candidate.tar.gz.sha256
            comet-edge-candidate.provenance.json
          if-no-files-found: error

  staging:
    if: github.repository_owner == 'Ashler-AI'
    needs: [candidate, sync-staging-release-feed-secrets]
    runs-on: ubuntu-24.04
    environment: comet-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require reviewed staging source
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$TARGET" = staging
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: comet-edge-candidate-${{ github.sha }}
      - id: verify
        name: Verify staging candidate
        env:
          EXPECTED_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          sha256sum --check comet-edge-candidate.tar.gz.sha256
          actual="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_DIGEST"
          jq -e --arg digest "$actual" --arg commit "$GITHUB_SHA" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '.schemaVersion == 1 and .sha256 == $digest and .sourceCommit == $commit and .workflowRun == $workflowRun' \
            comet-edge-candidate.provenance.json
          mkdir "$RUNNER_TEMP/candidate"
          tar -xzf comet-edge-candidate.tar.gz -C "$RUNNER_TEMP/candidate"
          entry="$RUNNER_TEMP/candidate/migration-retirement.js"
          test -f "$entry"
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
          echo "digest=$actual" >> "$GITHUB_OUTPUT"
      - id: gcp_iap
        name: Mint staging GCP IAP identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_IAP_AUDIENCE }}
          create_credentials_file: false
      - name: Require staging IAP credential
        env:
          IAP_ID_TOKEN: ${{ steps.gcp_iap.outputs.id_token }}
        run: test -n "$IAP_ID_TOKEN"
      - name: Deploy exact candidate with checked-in staging resources
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = dd15bb23eb5c14365fe2621acc049e01
          npx wrangler deploy "${{ steps.verify.outputs.entry }}" --no-bundle --config wrangler.migration-staging.jsonc

  sync-staging-release-feed-secrets:
    if: github.repository_owner == 'Ashler-AI'
    needs: candidate
    runs-on: ubuntu-24.04
    environment: comet-release-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require reviewed staging source
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$TARGET" = staging
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - name: Synchronize staging release-feed secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMET_RELEASES_GCS_BUCKET: ${{ secrets.COMET_RELEASES_GCS_BUCKET }}
          GCP_RELEASE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_EMAIL }}
          GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: node scripts/sync-edge-release-feed-secrets.mjs staging
