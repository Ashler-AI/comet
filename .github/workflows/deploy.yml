name: deploy

on:
  push:
    branches: [main]
    tags: ["edge-staging-v*"]
    paths:
      - edge/**
      - apps/comet/**
      - crates/**
      - scripts/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      target:
        description: "Highest environment to deploy"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: comet-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked edge dependencies
        working-directory: edge
        run: npm ci
      - name: Install native Rust build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake
      - name: Select checked-in Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build real headless host
        run: cargo build --locked --package comet --bin comet
      - name: Real local Edge and Rust collaboration smoke
        env:
          COMET_BIN: ${{ github.workspace }}/target/debug/comet
        run: node scripts/headless-collaboration-smoke.mjs
      - name: Generate Worker binding types
        working-directory: edge
        run: npm run types
      - name: Require current Worker binding declarations
        run: git diff --exit-code -- edge/worker-configuration.d.ts
      - name: Typecheck
        working-directory: edge
        run: npm run typecheck
      - name: Test
        working-directory: edge
        run: npm test
      - name: Build deployment candidate once
        working-directory: edge
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/comet-edge-candidate"
      - id: candidate
        name: Seal candidate digest
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf comet-edge-candidate.tar.gz -C "$RUNNER_TEMP/comet-edge-candidate" .
          digest="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          printf '%s  %s\n' "$digest" comet-edge-candidate.tar.gz > comet-edge-candidate.tar.gz.sha256
          jq -n --arg digest "$digest" --arg commit "$GITHUB_SHA" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schemaVersion:1,sha256:$digest,sourceCommit:$commit,workflowRun:$workflowRun}' \
            > comet-edge-candidate.provenance.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: comet-edge-candidate-${{ github.sha }}
          path: |
            comet-edge-candidate.tar.gz
            comet-edge-candidate.tar.gz.sha256
            comet-edge-candidate.provenance.json
          if-no-files-found: error

  staging:
    if: github.repository_owner == 'Ashler-AI'
    needs: [candidate, sync-staging-release-feed-secrets]
    runs-on: ubuntu-24.04
    environment: comet-staging
    outputs:
      deployed_digest: ${{ steps.verify.outputs.digest }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: comet-edge-candidate-${{ github.sha }}
      - id: verify
        name: Verify staging candidate
        env:
          EXPECTED_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          sha256sum --check comet-edge-candidate.tar.gz.sha256
          actual="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_DIGEST"
          mkdir "$RUNNER_TEMP/candidate"
          tar -xzf comet-edge-candidate.tar.gz -C "$RUNNER_TEMP/candidate"
          entry="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$entry"
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
          echo "digest=$actual" >> "$GITHUB_OUTPUT"
      - id: gcp_iap
        name: Mint staging GCP IAP identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_IAP_AUDIENCE }}
          create_credentials_file: false
      - name: Require staging IAP credential
        env:
          IAP_ID_TOKEN: ${{ steps.gcp_iap.outputs.id_token }}
        run: test -n "$IAP_ID_TOKEN"
      - name: Deploy exact candidate with checked-in staging resources
        working-directory: edge
        run: npx wrangler deploy "${{ steps.verify.outputs.entry }}" --no-bundle --config wrangler.jsonc --env staging

  production:
    if: github.repository_owner == 'Ashler-AI' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: [candidate, staging, sync-production-release-feed-secrets]
    runs-on: ubuntu-24.04
    # Explicit operator override: production reuses the staging environment's
    # deployment credentials after the platform-account assertions below.
    environment: comet-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: comet-edge-candidate-${{ github.sha }}
      - id: verify
        name: Require byte-identical staged candidate
        env:
          BUILD_DIGEST: ${{ needs.candidate.outputs.digest }}
          STAGING_DIGEST: ${{ needs.staging.outputs.deployed_digest }}
        run: |
          sha256sum --check comet-edge-candidate.tar.gz.sha256
          actual="$(sha256sum comet-edge-candidate.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$BUILD_DIGEST"
          test "$actual" = "$STAGING_DIGEST"
          mkdir "$RUNNER_TEMP/candidate"
          tar -xzf comet-edge-candidate.tar.gz -C "$RUNNER_TEMP/candidate"
          entry="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$entry"
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
      - name: Require Ashler platform-scoped GCP credentials
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_IAP_AUDIENCE: ${{ vars.GCP_IAP_AUDIENCE }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          test "$GCP_PROJECT_ID" = "ashler-platform"
          test "$GCP_IAP_AUDIENCE" = "54440053364-sdi2vlnsaavl9qne53p98lah23g8vei7.apps.googleusercontent.com"
          case "$GCP_SERVICE_ACCOUNT" in
            *@"$GCP_PROJECT_ID".iam.gserviceaccount.com) ;;
            *) echo "::error::GCP service account is outside $GCP_PROJECT_ID"; exit 1 ;;
          esac
          case "$GCP_WORKLOAD_IDENTITY_PROVIDER" in
            projects/54440053364/locations/global/workloadIdentityPools/*/providers/*) ;;
            *) echo "::error::Workload identity provider is outside GCP project 54440053364"; exit 1 ;;
          esac
      - id: gcp_iap
        name: Mint production GCP IAP identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ vars.GCP_IAP_AUDIENCE }}
          create_credentials_file: false
      - name: Require production IAP credential
        env:
          IAP_ID_TOKEN: ${{ steps.gcp_iap.outputs.id_token }}
        run: test -n "$IAP_ID_TOKEN"
      - name: Deploy exact staged candidate with checked-in production resources
        working-directory: edge
        run: npx wrangler deploy "${{ steps.verify.outputs.entry }}" --no-bundle --config wrangler.jsonc --env production

  sync-staging-release-feed-secrets:
    if: github.repository_owner == 'Ashler-AI'
    needs: candidate
    runs-on: ubuntu-24.04
    environment: comet-release-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COMET_RELEASES_GCS_BUCKET: ${{ secrets.COMET_RELEASES_GCS_BUCKET }}
      GCP_RELEASE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_EMAIL }}
      GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - name: Synchronize staging release-feed secrets
        run: node scripts/sync-edge-release-feed-secrets.mjs staging

  sync-production-release-feed-secrets:
    if: github.repository_owner == 'Ashler-AI' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: [candidate, staging]
    runs-on: ubuntu-24.04
    environment: comet-release-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COMET_RELEASES_GCS_BUCKET: ${{ secrets.COMET_RELEASES_GCS_BUCKET }}
      GCP_RELEASE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_EMAIL }}
      GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install locked deploy tooling
        working-directory: edge
        run: npm ci
      - name: Synchronize production release-feed secrets
        run: node scripts/sync-edge-release-feed-secrets.mjs production
