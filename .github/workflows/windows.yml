name: Windows tests

on:
  workflow_dispatch:
    inputs:
      native_gui:
        description: 'Run native GUI/pixel probes (requires a usable desktop and Direct3D)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  # The original single serial job is split into three independent jobs so they
  # run in parallel. Together they run exactly the commands the single job ran.
  ui-tests:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/windows-ci-setup
      - name: UI tests
        env:
          RUST_BACKTRACE: '1'
        run: |
          # Native platform initialization runs in its own process. Keep the
          # real-font assertion and the complete headless suite mandatory.
          cargo test --release --locked -p zeron-ui --lib native_diff_font_geometry -- --test-threads=1 --nocapture
          $nativeResult = $LASTEXITCODE
          cargo test --release --locked -p zeron-ui --lib -- --test-threads=1 --skip native_diff_font_geometry --nocapture
          $headlessResult = $LASTEXITCODE
          if ($nativeResult -ne 0 -or $headlessResult -ne 0) { exit 1 }

  # The crate suites compile different package sets, so the two jobs below each
  # build what they need in parallel instead of one job building them in turn.
  harness-app-tests:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/windows-ci-setup
      - name: Native harness security and integration tests
        run: cargo test --release --locked -p zeron-harness --features native-fixture --lib --test codex_availability --test windows_native
      # The driver suites whose fixtures run without a POSIX shell: an in-test
      # HTTP/SSE server (OpenCode), node (the Cursor shim) and a Rust peer
      # (Pi). The shell- and python-fixture suites are unix-only.
      - name: Portable harness integration tests
        run: cargo test --release --locked -p zeron-harness --features native-fixture --test opencode --test cursor_shim --test pi_rpc
      - name: Shader layout tests
        run: cargo test --release --locked -p gpui_windows --lib layout
      - name: Application and updater tests
        run: cargo test --release --locked -p zeron -p zeron-update

  engine-tests:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/windows-ci-setup
      - name: Worktree path compatibility
        run: |
          cargo test --release --locked -p zeron-proto --lib device_paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked -p zeron-engine --test worktree_on_run worktree_location_
      - name: Engine unit tests
        run: cargo test --release --locked -p zeron-engine --lib
      - name: Harness catalog and login tests
        run: cargo test --release --locked -p zeron-engine --test codex_catalog --test codex_login_resolution
      - name: Auth integration tests
        run: cargo test --release --locked -p zeron-engine --test auth

  app:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/windows-ci-setup
      - name: Build application
        run: cargo build --release --locked -p zeron
      - name: Verify portable and installer packaging
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
      - name: Installer install/uninstall
        run: ./scripts/test-windows-installer.ps1
      - name: GUI subsystem and redirected CLI output
        run: ./scripts/test-windows-startup.ps1
      - name: CLI startup without HOME
        run: |
          # Exercise real HOME-absent path resolution with no inherited profile or credentials.
          $localAppData = Join-Path $env:RUNNER_TEMP ("zeron smoke O'Brien 日本語 " + [guid]::NewGuid())
          $ipc = [Net.Sockets.Socket]::new([Net.Sockets.AddressFamily]::InterNetwork, [Net.Sockets.SocketType]::Stream, [Net.Sockets.ProtocolType]::Tcp)
          try {
            # Reserve a valid port exclusively without listening or admitting engine RPCs.
            $ipc.ExclusiveAddressUse = $true
            $ipc.Bind([Net.IPEndPoint]::new([Net.IPAddress]::Loopback, 0))
            $probe = [Diagnostics.ProcessStartInfo]::new()
            $probe.FileName = (Resolve-Path -LiteralPath './target/release/zeron.exe').Path
            $probe.Arguments = 'status'
            $probe.UseShellExecute = $false
            $probe.CreateNoWindow = $true
            $probe.RedirectStandardOutput = $true
            $probe.RedirectStandardError = $true
            $probe.Environment.Clear()
            foreach ($name in @('SystemRoot', 'WINDIR', 'TEMP', 'TMP')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ($null -ne $value) { $probe.Environment[$name] = $value }
            }
            $probe.Environment['LOCALAPPDATA'] = $localAppData
            $probe.Environment['COMET_IPC_PORT'] = [string]$ipc.LocalEndPoint.Port
            $process = [Diagnostics.Process]::Start($probe)
            try {
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              if (-not $process.WaitForExit(10000)) {
                $process.Kill()
                throw 'Isolated status probe timed out'
              }
              if ($process.ExitCode -ne 0) { throw "Status failed: $($stderr.Result)" }
              $output = $stdout.Result -split '\r?\n'
            } finally { $process.Dispose() }
            $output
            $dataDirs = @($output | Where-Object { $_.StartsWith('Data dir: ') })
            if ($dataDirs.Count -ne 1) { throw 'Status did not report one data directory' }
            $selected = [IO.Path]::GetFullPath($dataDirs[0].Substring('Data dir: '.Length))
            if ([IO.Path]::GetDirectoryName($selected) -ne $localAppData) {
              throw 'Windows startup did not select a profile under isolated LOCALAPPDATA'
            }
          } finally { $ipc.Dispose() }
      - name: Build rendering fixture
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
        run: cargo build --release --locked -p zeron-ui --example windows-render-fixture --features windows-render-fixture
      - name: Upload GUI test binaries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-gui-binaries
          path: |
            target/release/zeron.exe
            target/release/examples/windows-render-fixture.exe
          if-no-files-found: error
          retention-days: 1

  native-gui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_gui }}
    needs: app
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-gui-binaries
          path: target/release
      - name: App lifecycle tests
        run: ./scripts/test-windows-lifecycle.ps1
      - name: Rendering tests
        run: ./scripts/test-windows-rendering.ps1
      - name: Upload GUI test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-probes
          path: |
            target/windows-render-*/capture.png
            target/windows-render-*/measurements.json
            target/windows-render-*/stdout.txt
            target/windows-render-*/stderr.txt
            target/windows-lifecycle-*/result.txt
            target/windows-lifecycle-*/run-*.txt
          if-no-files-found: warn
