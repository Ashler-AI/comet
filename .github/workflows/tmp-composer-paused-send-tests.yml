# Temporary: runs the composer's paused-send test on Linux for this branch (the author's Mac had no
# disk for a UI build). Delete before merging.
name: Composer paused-send tests (temporary)
on:
  push:
    branches: [fix/scaffold-paused-send-queues]
permissions:
  contents: read
jobs:
  composer:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Select checked-in Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: The new test fails on the test-only commit
        run: |
          test_commit=$(git log --format=%H -1 --grep='^test(composer): a send to a paused Scaffold session')
          git checkout "$test_commit" -- crates/ui/src/composer.rs
          if cargo test -p zeron-ui --lib -- composer::tests::send_to_a_paused_scaffold_chat_queues_it_resumes_the_sandbox_then_delivers --exact --test-threads=1; then
            echo "::error::the new test passed without the fix"
            exit 1
          fi
          git checkout HEAD -- crates/ui/src/composer.rs
      - name: The new test passes with the fix
        run: |
          cargo test -p zeron-ui --lib -- composer::tests::send_to_a_paused_scaffold_chat_queues_it_resumes_the_sandbox_then_delivers --exact --test-threads=1
      - name: Every composer test passes with the fix
        run: |
          cargo test -p zeron-ui --lib -- composer:: --test-threads=1
