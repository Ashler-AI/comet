name: sync-reliability

on:
  pull_request:
    paths:
      - apps/**
      - crates/**
      - edge/**
      - scripts/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/**
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-sync-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    uses: ./.github/workflows/native-verification.yml
  mobile:
    uses: ./.github/workflows/mobile.yml
    with:
      environment: staging
