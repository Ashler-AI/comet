name: Crew Canary artifacts

# Private Actions artifacts only. No tags, GitHub Releases, shared R2 buckets,
# latest pointers or unauthenticated update manifests.
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed integration-ready source SHA (private artifacts only)
        required: true
        type: string

permissions:
  contents: read

env:
  ASHLER_INCREMENTAL_TSC_CHECKS: 'false'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  approve-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact reviewed source
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/crew/upstream-canary|refs/heads/crew/canary-agent-auth-fix-20261022|refs/heads/fix/canary-native-controller-95e5) ;;
            *) exit 1 ;;
          esac
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
  native-contracts:
    needs: approve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Native browser and package contracts
        run: |
          node --test apps/web/*.test.mjs
          bash scripts/test-linux-desktop-entry.sh
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Native authority and historical command regressions
        run: >-
          cargo test --locked --features zeron-sync/mock-server
          -p zeron-engine -p zeron-sync -p zeron-doc
          --lib --test auth --test scaffold_auth --test crew_import --test crew_annotations

  linux:
    needs: [approve-source, native-contracts]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Package exact checkout
        run: scripts/package-linux.sh
      - name: Record private artifact provenance
        run: |
          cd target/package
          sha256sum crew-upstream-canary-*-linux-*.tar.gz > SHA256SUMS
          printf '{"sourceRevision":"%s","runtimeContract":"%s","webContract":"%s","delivery":"private-manual"}\n' \
            "$GITHUB_SHA" "$(cat ../../scaffold-runtime-version.txt)" \
            "$(node -p 'JSON.parse(require("fs").readFileSync("../../apps/web/contract.json", "utf8")).version')" > provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crew-upstream-canary-linux-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/package/crew-upstream-canary-*-linux-*.tar.gz
            target/package/SHA256SUMS
            target/package/provenance.json
          if-no-files-found: error

  macos:
    needs: [approve-source, native-contracts]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Canary launch authority and browser suppression
        run: cargo test --locked -p zeron --bin zeron --test noop_browser
      - name: Package isolated ad-hoc signed app
        run: scripts/package-macos.sh
      - name: Record private artifact provenance
        run: |
          cd target/package
          shasum -a 256 crew-upstream-canary-*-macos-*.dmg crew-upstream-canary-*-macos-*-app.tar.gz > SHA256SUMS
          printf '{"sourceRevision":"%s","runtimeContract":"%s","delivery":"private-manual","bundleId":"ai.ashler.crew.upstream-canary"}\n' \
            "$GITHUB_SHA" "$(cat ../../scaffold-runtime-version.txt)" > provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crew-upstream-canary-macos-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/package/crew-upstream-canary-*-macos-*.dmg
            target/package/crew-upstream-canary-*-macos-*-app.tar.gz
            target/package/SHA256SUMS
            target/package/provenance.json
          if-no-files-found: error
