name: Crew Canary artifacts

# Private Actions artifacts only. No tags, GitHub Releases, shared R2 buckets,
# latest pointers or unauthenticated update manifests.
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed integration-ready source SHA (private artifacts only)
        required: true
        type: string

permissions:
  contents: read

env:
  ASHLER_INCREMENTAL_TSC_CHECKS: 'false'

jobs:
  approve-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact reviewed source
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/crew/upstream-canary
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
  edge-contracts:
    needs: approve-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify Edge in remote CI without deployment credentials
        working-directory: edge
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Verify native browser contracts
        run: node --test apps/web/server.test.mjs

  linux:
    needs: approve-source
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Package exact checkout
        run: scripts/package-linux.sh
      - name: Verify sandbox storage and native resume
        run: |
          cargo test --locked --release -p zeron-engine --test scaffold_auth
          cargo test --locked --release -p zeron-engine --lib scaffold::tests
          cargo test --locked --release -p zeron-engine --lib crew::tests::accepted_startup_is_not_a_confirmed_resume
      - name: Record private artifact provenance
        run: |
          cd target/package
          sha256sum crew-upstream-canary-*-linux-*.tar.gz > SHA256SUMS
          for archive in crew-upstream-canary-*-linux-*.tar.gz; do
            binary="${archive%.tar.gz}/comet"
            digest="$(tar -xOf "$archive" "$binary" | sha256sum | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$binary"
          done > COMET_SHA256SUMS
          printf '{"sourceRevision":"%s","runtimeContract":"%s","delivery":"private-manual"}\n' \
            "$GITHUB_SHA" "$(cat ../../scaffold-runtime-version.txt)" > provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crew-upstream-canary-linux-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/package/crew-upstream-canary-*-linux-*.tar.gz
            target/package/SHA256SUMS
            target/package/COMET_SHA256SUMS
            target/package/provenance.json
          if-no-files-found: error

  macos:
    needs: approve-source
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Package isolated ad-hoc signed app
        run: scripts/package-macos.sh
      - name: Verify native recovery, routing and sandbox lifecycle
        run: |
          cargo test --locked --release -p zeron-harness --test omp
          cargo test --locked --release -p zeron --test noop_browser
          cargo test --locked --release -p zeron-engine --test scaffold_auth
          cargo test --locked --release -p zeron-engine --lib scaffold::tests
          cargo test --locked --release -p zeron-engine --lib crew::tests::accepted_startup_is_not_a_confirmed_resume
      - name: Record private artifact provenance
        run: |
          cd target/package
          shasum -a 256 crew-upstream-canary-*-macos-*.dmg crew-upstream-canary-*-macos-*-app.tar.gz > SHA256SUMS
          printf '{"sourceRevision":"%s","delivery":"private-manual","bundleId":"ai.ashler.crew.upstream-canary"}\n' \
            "$GITHUB_SHA" > provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crew-upstream-canary-macos-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/package/crew-upstream-canary-*-macos-*.dmg
            target/package/crew-upstream-canary-*-macos-*-app.tar.gz
            target/package/SHA256SUMS
            target/package/provenance.json
          if-no-files-found: error
