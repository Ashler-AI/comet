name: Crew upstream isolated canary
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed integration-ready workflow/source SHA (no shared release publication)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: crew-upstream-canary-deploy
  cancel-in-progress: false
env:
  ASHLER_INCREMENTAL_TSC_CHECKS: 'false'
jobs:
  approve-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact reviewed source
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/crew/upstream-canary
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
  artifacts:
    needs: approve-source
    uses: ./.github/workflows/release.yml
  edge:
    needs: [approve-source, artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require matching isolated authority
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            https://scaffold-upstream-canary.internal.ashler.com/.well-known/oauth-protected-resource \
            | jq -e '.resource == "https://scaffold-upstream-canary.internal.ashler.com"'
      - name: Install and check Edge
        working-directory: edge
        run: |
          npm ci
          npm test -- --run
          npx tsc --noEmit
      - name: Deploy only isolated Edge
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_CANARY }}
          CLOUDFLARE_ACCOUNT_ID: dd15bb23eb5c14365fe2621acc049e01
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --env canary
          curl --fail --silent --show-error --max-time 15 \
            https://crew-upstream-canary.cgoggins.workers.dev/health \
            | jq -e '.auth == "scaffold" and .environment == "crew-upstream-canary"'
