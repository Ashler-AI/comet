name: Crew Staging mobile archive
run-name: Crew Staging mobile ${{ inputs.build_number }} from ${{ inputs.reviewed_sha }}

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed source SHA (must match selected ref)
        required: true
        type: string
      build_number:
        description: Next staging build verified from current App Store Connect metadata
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: crew-staging-mobile-archive
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/crew/staging-native-cutover'
    # Xcode 27.1 keeps the app out of compatibility mode on iPhone Duo.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      ASHLER_INCREMENTAL_TSC_CHECKS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin reviewed source and Xcode 27.1
        shell: bash
        run: |
          set -euo pipefail
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$BUILD_NUMBER" -ge 37
          test -d /Applications/Xcode_27.1.app
          sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
      - name: Rust toolchain and targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: crew-staging-ios-core
          cache-on-failure: true
      - name: Archive upstream-based staging client without Apple credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-artifacts
          xcodebuild -project apps/ios/Zeron.xcodeproj -scheme 'Crew Staging' \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Crew-Staging.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          scripts/ios/prepare-staging-archive.sh "$RUNNER_TEMP/Crew-Staging.xcarchive" "$BUILD_NUMBER"
          app="$RUNNER_TEMP/Crew-Staging.xcarchive/Products/Applications/Zeron.app"
          codesign -d --entitlements :- "$app" > mobile-artifacts/archive-signed.entitlements
          tar -czf mobile-artifacts/Crew-Staging.xcarchive.tar.gz -C "$RUNNER_TEMP" Crew-Staging.xcarchive
          printf '%s\n' "$GITHUB_SHA" > mobile-artifacts/source-sha.txt
          jq -n --arg source "$GITHUB_SHA" --arg build "$BUILD_NUMBER" \
            '{sourceRevision:$source,buildNumber:$build,deploymentId:"ashler-staging",bundleId:"ai.ashler.crew.staging",teamId:"825LYXGJR6",signing:"ad-hoc",core:"zeron-mobile"}' > mobile-artifacts/provenance.json
          shasum -a 256 mobile-artifacts/Crew-Staging.xcarchive.tar.gz > mobile-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crew-mobile-staging-${{ github.sha }}
          path: mobile-artifacts/
          if-no-files-found: error
          compression-level: 0
