# Temporary: runs the composer's Scaffold send tests on Linux for this branch. Delete before merging.
name: Composer Scaffold send tests (temporary)
on:
  push:
    branches: [fix/scaffold-sends-queue-until-ready]
permissions:
  contents: read
jobs:
  composer:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TESTS: >-
        composer::tests::ready_scaffold_launch_sends_its_first_message_after_the_user_moved_on
        composer::tests::a_send_while_a_scaffold_sandbox_starts_joins_its_first_message
        composer::tests::send_to_a_paused_scaffold_chat_queues_it_resumes_the_sandbox_then_delivers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Select checked-in Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Each new test fails on the test-only commit, which compiles
        run: |
          test_commit=$(git log --format=%H -1 --grep='^test(composer): Scaffold sends queue until the sandbox is up')
          git checkout "$test_commit" -- crates/ui/src/composer.rs
          cargo test -p zeron-ui --lib --no-run
          for name in $TESTS; do
            if cargo test -p zeron-ui --lib -- "$name" --exact --test-threads=1; then
              echo "::error::$name passed without the fix"
              exit 1
            fi
          done
          git checkout HEAD -- crates/ui/src/composer.rs
      - name: The new tests pass with the fix
        run: |
          for name in $TESTS; do
            cargo test -p zeron-ui --lib -- "$name" --exact --test-threads=1
          done
      - name: Every composer test passes with the fix
        run: |
          cargo test -p zeron-ui --lib -- composer:: --test-threads=1
