[package]
name = "comet-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
comet-doc.workspace = true
serde_json.workspace = true
loro.workspace = true
loro-protocol.workspace = true
